# Integración continua: en cada push y cada Pull Request se comprueba que el backend
# y el frontend pasan el linter, el formateo, los tests y la compilación
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL de usar y tirar para los tests, igual que el de Docker Compose
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: taxigest
          POSTGRES_PASSWORD: taxigest
          POSTGRES_DB: taxigest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxigest -d taxigest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores solo para el CI: no son secretos. Sin ANTHROPIC_API_KEY se usa el OCR simulado
    env:
      DATABASE_URL: postgresql+psycopg://taxigest:taxigest@localhost:5432/taxigest
      JWT_SECRET: clave-solo-para-el-ci
      IMAGES_DIR: uploads

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Linter (ruff)
        run: ruff check .

      - name: Formateo (ruff)
        run: ruff format --check .

      - name: Migraciones (Alembic)
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest

      - name: Build de la imagen Docker
        run: docker build .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Linter (oxlint)
        run: npm run lint

      - name: Formateo (Prettier)
        run: npm run format:check

      - name: Tests (Vitest)
        run: npm test

      - name: Build (tipos y producción)
        run: npm run build
